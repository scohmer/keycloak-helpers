# Keycloak + PostgreSQL, TLS-terminated at Keycloak itself (no reverse proxy
# in this phase). Secrets come from .env (see .env.example) — never commit
# a real .env with populated passwords.

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 6

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Hostname v2 syntax: scheme+host+port combined in one value.
      KC_HOSTNAME: https://${KC_HOSTNAME}:8443
      KC_HOSTNAME_STRICT: "true"
      KC_HTTPS_CERTIFICATE_FILE: /etc/x509/https/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/x509/https/tls.key
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Mounting the CA bundle into the system trust-extraction path (below)
      # is NOT picked up automatically by the JVM for outbound TLS (e.g.
      # LDAPS to AD) — confirmed via SSLHandshakeFailed on LDAP federation
      # testConnection. KC_TRUSTSTORE_PATHS is what actually wires it in.
      KC_TRUSTSTORE_PATHS: /etc/x509/ca/ca-bundle.crt
      # Management interface (health/metrics, port 9000) stays plain HTTP —
      # it is never published to the host, only reachable inside the
      # container's own network namespace (used by the healthcheck below).
      KC_HTTP_MANAGEMENT_SCHEME: http
      # Current bootstrap-admin env vars (KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD
      # are deprecated as of Keycloak 26 but still honored for one release).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    command: ["start", "--log-level=INFO"]
    volumes:
      - ./certs/keycloak-tls.crt:/etc/x509/https/tls.crt:ro,Z
      - ./certs/keycloak-tls.key:/etc/x509/https/tls.key:ro,Z
      - ./certs/ca-bundle.crt:/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:ro,Z
      - ./certs/ca-bundle.crt:/etc/x509/ca/ca-bundle.crt:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak-network
    restart: unless-stopped
    ports:
      - "8443:8443"
    healthcheck:
      # No curl/wget in this image; use bash's /dev/tcp against the
      # plain-HTTP management interface (see KC_HTTP_MANAGEMENT_SCHEME above).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:

networks:
  keycloak-network:
    driver: bridge
